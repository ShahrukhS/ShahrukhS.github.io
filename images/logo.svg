<svg viewBox="0 0 340 112" width="340" height="112" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- Helm wheel icon — center (56,56), ring r=46 -->
  <circle cx="56" cy="56" r="46" fill="none" stroke="#1C1A18" stroke-width="2.5"/>

  <!-- 8 spokes (inner r=14, outer r=44) -->
  <line x1="70"   y1="56"   x2="100"  y2="56"   stroke="#1C1A18" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="65.9" y1="65.9" x2="87.1" y2="87.1" stroke="#1C1A18" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="56"   y1="70"   x2="56"   y2="100"  stroke="#1C1A18" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="46.1" y1="65.9" x2="24.9" y2="87.1" stroke="#1C1A18" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="42"   y1="56"   x2="12"   y2="56"   stroke="#1C1A18" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="46.1" y1="46.1" x2="24.9" y2="24.9" stroke="#1C1A18" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="56"   y1="42"   x2="56"   y2="12"   stroke="#1C1A18" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="65.9" y1="46.1" x2="87.1" y2="24.9" stroke="#1C1A18" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Copper diamond hub (forge spark) -->
  <polygon points="56,45 67,56 56,67 45,56" fill="#B87340"/>

  <!-- Thin vertical separator -->
  <line x1="122" y1="21" x2="122" y2="91" stroke="#1C1A18" stroke-width="0.6" opacity="0.16"/>

  <!-- Wordmark -->
  <text x="137" y="56"
        font-family="Cinzel, Georgia, serif"
        font-size="28" font-weight="700"
        letter-spacing="5"
        fill="#1C1A18">HELM</text>

  <text x="139" y="77"
        font-family="Cinzel, Georgia, serif"
        font-size="13.5" font-weight="400"
        letter-spacing="9.5"
        fill="#B87340">FORGE</text>
</svg>
